spring:
  datasource:
    username: root
    password: root
    url: jdbc:mysql://192.168.56.10:3306/gulimall_pms
    driver-class-name: com.mysql.cj.jdbc.Driver

  application:
    name: gulimall-product

  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
        username: nacos
        password: nacos
      config:
        server-addr: 127.0.0.1:8848
#        file-extension: properties
        namespace: efec4709-1489-4d23-9203-691f836e3afe
        group: dev
        refresh-enabled: true
  config:
    import:
      - nacos:${spring.application.name}
      - nacos:mybatis.yaml
      - nacos:datasorcus.yaml
      - nacos:other.yaml

mybatis-plus:
  mapper-locations: classpath:/mapper/**/*.xml
  global-config:
    db-config:
      id-type: auto
      logic-delete-value: 1
      logic-not-delete-value: 0

server:
  port: 10000
logging:
  level:
    com.jay.gulimall: debug
