spring:
  main:
    web-application-type: reactive
  application:
    name: gulimall-gateway
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
        username: nacos
        password: nacos
      config:
        server-addr: 127.0.0.1:8848
        namespace: b76b2878-4fd2-47a2-9fe1-11be8cdb0fa7
        group: dev
        refresh-enabled: true

    gateway:
      routes:
        - id: test
          uri: http://www.baidu.com
          predicates:
            - Query= url,baidu

        - id: test1
          uri: http://www.google.com
          predicates:
            - Query= url,qq

        ##http://localhost:10000/product/category/list/tree實際能訪問
        ##http://localhost:88/api/product/category/list/tree目前 所以需要路徑重寫
        - id: product_router
          uri: lb://gulimall-product
          predicates:
            - Path=/api/product/**
          filters:
            - RewritePath=/api/(?<segment>.*),/$\{segment}
        ##http://localhost:10000/product/category/list/tree實際能訪問
        ##http://localhost:88/api/product/category/list/tree目前 所以需要路徑重寫
        - id: third_router
          uri: lb://gulimall-third
          predicates:
            - Path=/api/third/**
          filters:
            - RewritePath=/api/(?<segment>.*),/$\{segment}
        ##前端項目， /api
        ##http://localhost:8080/renren-fast/api/captcha:jpg?uuid=760a9eb0-4f40-4e4b-83af-a6401e4723b7: 實際能訪問
        ##http://localhost:88/api/captcha:jpg?uuid=760a9eb0-4f40-4e4b-83af-a6401e4723b7: 目前 所以需要路徑重寫
        - id: admin_router
          uri: lb://renren-fast
          predicates:
            - Path=/api/**
          filters:
            ## 重寫路徑
            - RewritePath=/api/(?<segment>.*),/renren-fast/$\{segment}
            ## 避免重複跨域
            - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin


  config:
    import:
#      - nacos:${spring.application.name}
#      - nacos:mybatis.yaml
#      - nacos:datasorcus.yaml
      - nacos:other.yaml

server:
  port: 88

